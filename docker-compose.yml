services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: syncforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - syncforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d syncforge"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  syncforge-postgres:
